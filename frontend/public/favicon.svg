<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dayflowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A4828"/>
      <stop offset="50%" stop-color="#743A24"/>
      <stop offset="100%" stop-color="#542413"/>
    </linearGradient>
    <linearGradient id="sunAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#dayflowBg)" stroke="#EBB89B" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Subtle Sun Flow Arc -->
  <circle cx="48" cy="16" r="6" fill="url(#sunAccent)" opacity="0.9"/>
  <path d="M 48 8 A 8 8 0 0 1 56 16" stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Bold Geometric 'D' Logo -->
  <path d="M 20 16 L 33 16 C 42 16 47 22 47 32 C 47 42 42 48 33 48 L 20 48 Z M 27.5 23 L 27.5 41 L 32.5 41 C 37.5 41 40 37.5 40 32 C 40 26.5 37.5 23 32.5 23 Z" fill="#FFFFFF"/>
</svg>